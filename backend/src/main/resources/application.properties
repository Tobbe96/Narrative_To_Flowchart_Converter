spring.application.name=story-backend

# Allow larger .docx uploads (default Spring Boot limit is 1MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Include detailed error messages in HTTP error responses
server.error.include-message=always

# Keep connections alive long enough for multi-pass AI processing (12 minutes)
server.tomcat.connection-timeout=720000
server.tomcat.keep-alive-timeout=720000
